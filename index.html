<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A polished, simple weather forecast for any city.">
  <title>Skyline Weather</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #edf5ff;
      --surface: rgba(255, 255, 255, .78);
      --surface-strong: #ffffff;
      --text: #10233f;
      --muted: #61718a;
      --border: rgba(35, 83, 143, .13);
      --accent: #2368d3;
      --accent-soft: #dbeaff;
      --shadow: 0 20px 55px rgba(40, 84, 145, .14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1b2e;
        --surface: rgba(21, 39, 63, .8);
        --surface-strong: #172b47;
        --text: #edf5ff;
        --muted: #a8bad2;
        --border: rgba(176, 207, 246, .14);
        --accent: #80b5ff;
        --accent-soft: #1f416d;
        --shadow: 0 20px 55px rgba(0, 0, 0, .24);
      }
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      padding: 42px 18px;
      background:
        radial-gradient(circle at 15% 0%, rgba(93, 170, 255, .2), transparent 32%),
        radial-gradient(circle at 100% 10%, rgba(255, 193, 111, .17), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    main { max-width: 620px; margin: 0 auto; }
    .topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; }
    .brand-mark {
      display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px;
      background: linear-gradient(145deg, #ffd86b, #ff9e6d); box-shadow: 0 8px 18px rgba(255, 154, 89, .28);
      font-size: 18px;
    }
    .eyebrow { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font-size: clamp(26px, 6vw, 36px); letter-spacing: -.05em; line-height: 1.1; }
    .search { display: flex; gap: 9px; margin-bottom: 18px; }
    .search input {
      min-width: 0; flex: 1; border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px;
      background: var(--surface); color: var(--text); font: inherit; outline: none; box-shadow: var(--shadow);
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
    button {
      border: 0; border-radius: 14px; padding: 0 18px; background: var(--accent); color: #fff; cursor: pointer;
      font: inherit; font-weight: 750; transition: transform .18s ease, filter .18s ease;
    }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .7; transform: none; }
    .card { border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); backdrop-filter: blur(18px); }
    .current { position: relative; overflow: hidden; padding: 25px; }
    .current::after { position: absolute; right: -36px; bottom: -72px; width: 190px; height: 190px; border-radius: 50%; background: var(--accent-soft); content: ""; opacity: .65; }
    .location-row { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 16px; }
    .location { margin: 0; font-size: 22px; letter-spacing: -.035em; }
    .date { margin: 3px 0 0; color: var(--muted); }
    .current-main { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; margin-top: 24px; }
    .temperature { margin: 0; font-size: clamp(62px, 17vw, 94px); font-weight: 300; letter-spacing: -.09em; line-height: .9; }
    .temperature sup { margin-left: 5px; font-size: .35em; font-weight: 500; letter-spacing: 0; vertical-align: top; }
    .weather-icon { font-size: 73px; filter: drop-shadow(0 8px 10px rgba(28, 74, 133, .16)); }
    .condition { margin: 17px 0 0; font-size: 17px; font-weight: 700; }
    .metrics { display: flex; gap: 24px; margin-top: 17px; color: var(--muted); font-size: 13px; }
    .metrics strong { display: block; margin-top: 2px; color: var(--text); font-size: 14px; }
    .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 2px 12px; }
    .section-title h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .section-title span { color: var(--muted); font-size: 12px; }
    .forecast { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
    .day { padding: 15px 8px; text-align: center; }
    .day-name { color: var(--muted); font-size: 12px; font-weight: 700; }
    .day-icon { margin: 11px 0 8px; font-size: 29px; }
    .temps { font-size: 13px; font-weight: 700; }
    .temps span { color: var(--muted); font-weight: 500; }
    .status { min-height: 20px; margin: 11px 2px 0; color: var(--muted); font-size: 12px; }
    .status.error { color: #c64e45; }
    @media (max-width: 470px) {
      body { padding: 26px 13px; }
      .current { padding: 20px; }
      .forecast { gap: 6px; }
      .day { padding: 13px 3px; }
      .metrics { gap: 14px; }
      .weather-icon { font-size: 60px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topline">
      <div class="brand"><span class="brand-mark">☀</span><span>Skyline Weather</span></div>
      <p class="eyebrow">Live outlook</p>
    </header>

    <form class="search" id="search-form">
      <input id="city-input" type="search" placeholder="Search a city..." aria-label="Search a city" autocomplete="off">
      <button id="search-button" type="submit">Search</button>
    </form>

    <section class="card current" aria-live="polite">
      <div class="location-row">
        <div><h1 class="location" id="location">Tokyo, Japan</h1><p class="date" id="date"></p></div>
        <span id="timezone" class="eyebrow">Local time</span>
      </div>
      <div class="current-main">
        <div><p class="temperature" id="temperature">22<sup>°C</sup></p><p class="condition" id="condition">Partly cloudy</p></div>
        <span class="weather-icon" id="current-icon" aria-hidden="true">🌤️</span>
      </div>
      <div class="metrics">
        <span>Feels like<strong id="feels">22°C</strong></span>
        <span>Humidity<strong id="humidity">64%</strong></span>
        <span>Wind<strong id="wind">12 km/h</strong></span>
      </div>
    </section>

    <div class="section-title"><h2>5-day forecast</h2><span>Daily highs & lows</span></div>
    <section class="forecast" id="forecast" aria-label="Five day forecast"></section>
    <p class="status" id="status" role="status"></p>
  </main>

  <script>
    const fallback = {
      location: "Tokyo, Japan", timezone: "Asia/Tokyo", current: { temperature_2m: 22, apparent_temperature: 22, relative_humidity_2m: 64, wind_speed_10m: 12, weather_code: 2 },
      daily: { time: ["2026-09-17", "2026-09-18", "2026-09-19", "2026-09-20", "2026-09-21"], weather_code: [2, 1, 3, 61, 0], temperature_2m_max: [25, 27, 24, 22, 26], temperature_2m_min: [19, 20, 18, 17, 19] }
    };
    const weather = {
      0: ["Clear sky", "☀️"], 1: ["Mainly clear", "🌤️"], 2: ["Partly cloudy", "🌤️"], 3: ["Overcast", "☁️"],
      45: ["Foggy", "🌫️"], 48: ["Foggy", "🌫️"], 51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
      61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"], 71: ["Light snow", "🌨️"], 73: ["Snow", "❄️"],
      75: ["Heavy snow", "❄️"], 80: ["Rain showers", "🌦️"], 81: ["Rain showers", "🌧️"], 82: ["Heavy showers", "⛈️"], 95: ["Thunderstorm", "⛈️"], 99: ["Thunderstorm", "⛈️"]
    };
    const $ = (id) => document.getElementById(id);
    const formatDay = (date, index) => index === 0 ? "Today" : new Date(date + "T12:00:00").toLocaleDateString(undefined, { weekday: "short" });
    function render(data, usingFallback = false) {
      const current = data.current, daily = data.daily, description = weather[current.weather_code] || ["Mixed conditions", "🌤️"];
      $("location").textContent = data.location;
      $("timezone").textContent = data.timezone?.split("/").pop().replaceAll("_", " ") || "Local time";
      $("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
      $("temperature").innerHTML = `${Math.round(current.temperature_2m)}<sup>°C</sup>`;
      $("condition").textContent = description[0];
      $("current-icon").textContent = description[1];
      $("feels").textContent = `${Math.round(current.apparent_temperature)}°C`;
      $("humidity").textContent = `${current.relative_humidity_2m}%`;
      $("wind").textContent = `${Math.round(current.wind_speed_10m)} km/h`;
      $("forecast").innerHTML = daily.time.slice(0, 5).map((day, i) => {
        const info = weather[daily.weather_code[i]] || ["Mixed conditions", "🌤️"];
        return `<article class="card day"><div class="day-name">${formatDay(day, i)}</div><div class="day-icon" aria-hidden="true">${info[1]}</div><div class="temps">${Math.round(daily.temperature_2m_max[i])}° <span>/ ${Math.round(daily.temperature_2m_min[i])}°</span></div></article>`;
      }).join("");
      $("status").textContent = usingFallback ? "Live data is unavailable — showing a recent local forecast." : "Updated from Open-Meteo";
      $("status").className = `status${usingFallback ? " error" : ""}`;
    }
    async function loadWeather(city) {
      $("search-button").disabled = true;
      $("status").textContent = "Finding forecast...";
      $("status").className = "status";
      try {
        const geoResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
        if (!geoResponse.ok) throw new Error("Geocoding failed");
        const geo = await geoResponse.json();
        if (!geo.results?.length) throw new Error("City not found");
        const place = geo.results[0];
        const params = new URLSearchParams({ latitude: place.latitude, longitude: place.longitude, current: "temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code", daily: "weather_code,temperature_2m_max,temperature_2m_min", timezone: "auto", forecast_days: "5" });
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error("Forecast failed");
        const data = await response.json();
        render({ ...data, location: `${place.name}, ${place.country}`, timezone: data.timezone });
      } catch (error) {
        render(city.trim() ? { ...fallback, location: city.trim() } : fallback, true);
      } finally { $("search-button").disabled = false; }
    }
    $("search-form").addEventListener("submit", (event) => { event.preventDefault(); const city = $("city-input").value.trim(); if (city) loadWeather(city); });
    render(fallback);
    loadWeather("Tokyo");
  </script>
</body>
</html>
